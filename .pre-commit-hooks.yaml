- id: bergendy-watch
  name: bergendy watch
  description: Block commits introducing unvalidated external network boundaries
  entry: bergendy watch --ci
  language: python
  types_or: [javascript, jsx, ts, tsx, python, go]
  pass_filenames: true

- id: bergendy-gate
  name: bergendy gate
  description: Block commits introducing unvalidated external network boundaries
  entry: bergendy watch --ci
  language: python
  types_or: [javascript, jsx, ts, tsx, python, go]
  pass_filenames: true

- id: boundary-gate
