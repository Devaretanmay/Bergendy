name: 'Bergendy Enforcement'
description: 'Scan for unprotected network boundaries and enforce runtime schemas in CI/CD.'
author: 'Bergendy Team'
inputs:
  command:
    description: 'The bergendy command to run (see, watch, prove, fix)'
    required: false
    default: 'see'
  fail-on-unprotected:
    description: 'Fail the CI job if unprotected network boundaries are detected'
    required: false
    default: 'true'
  min-score:
    description: 'Minimum acceptable integrity score (0-100)'
    required: false
    default: '80'
  path:
    description: 'Repository root path to analyze'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install Bergendy
      shell: bash
      run: |
        pip install bergendy || pip install --user bergendy

    - name: Run Bergendy
      shell: bash
      run: |
        CMD="${{ inputs.command }}"
        if [ "$CMD" = "see" ] || [ "$CMD" = "scan" ]; then
          bergendy see "${{ inputs.path }}"
        elif [ "$CMD" = "watch" ] || [ "$CMD" = "gate" ] || [ "$CMD" = "guard" ]; then
          bergendy watch "${{ inputs.path }}" --ci --strict
        elif [ "$CMD" = "prove" ] || [ "$CMD" = "verify" ]; then
          bergendy prove "${{ inputs.path }}" --contract-only
        else
          bergendy "$CMD" "${{ inputs.path }}"
        fi
